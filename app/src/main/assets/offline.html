<!DOCTYPE html>
<html style="background:#0f0f0f;margin:0;padding:0;">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  body { background:#0c0c0c; color:#fff; font-family:Roboto,'Segoe UI',sans-serif; min-height:100vh; }
  svg { fill:currentColor; display:block; }
  #offlineView { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; }
  img.hero0 { width:200px; height:auto; margin-bottom:2rem; border-radius:16px; }
  h1 { font-size:1.5rem; margin-bottom:0.5rem; color:#e5b93c; }
  p.sub { color:#888; font-size:0.9rem; margin-bottom:2rem; }
  .btn { background:#e5b93c; color:#000; border:none; padding:0.8rem 2rem; border-radius:8px; font-size:1rem; font-weight:600; margin:0.4rem 0; min-width:230px; }
  .btn.ghost { background:transparent; color:#e5b93c; border:1px solid #e5b93c; }
  #dlView { display:none; padding-bottom:5rem; }
  .bar { display:flex; align-items:center; gap:0.4rem; padding:0.9rem 0.8rem 0.7rem; }
  .ibtn { background:none; border:none; color:#e5b93c; width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .ibtn svg { width:26px; height:26px; }
  .bar h2 { font-size:1.25rem; font-weight:700; white-space:nowrap; flex:none; }
  .store { margin-left:auto; display:flex; align-items:center; gap:0.3rem; min-width:0; white-space:nowrap; line-height:1.25; }
  .store svg { width:22px; height:22px; color:#e5b93c; flex:none; }
  .store .t { font-size:clamp(9px,2.8vw,11.5px); }
  .store small { display:block; color:#999; font-size:inherit; }
  .kebab { border:1px solid #2c2c2c; color:#ddd; width:36px; height:36px; }
  .kebab svg { width:20px; height:20px; }
  @media (max-width:340px) { .store svg { display:none; } }
  .hero { position:relative; height:236px; margin-top:0.3rem; overflow:hidden; border-bottom:1px solid rgba(229,185,60,0.4); }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 0.8s; pointer-events:none; }
  .slide.on { opacity:1; pointer-events:auto; }
  .slide img.bg { position:absolute; inset:-20px; width:calc(100% + 40px); height:calc(100% + 40px); object-fit:cover; filter:blur(18px) brightness(0.45) saturate(1.3); }
  .slide .bgfall { position:absolute; inset:0; background:linear-gradient(135deg,#3a2410,#14100c); }
  .slide .shade { position:absolute; inset:0; background:linear-gradient(90deg,rgba(0,0,0,0.7),rgba(0,0,0,0.1)),linear-gradient(0deg,#0c0c0c 2%,transparent 40%); }
  .slide .pic { position:absolute; right:1rem; top:1rem; bottom:1.4rem; width:34%; object-fit:cover; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.65); }
  .slide .in { position:absolute; left:1.1rem; width:56%; bottom:2.2rem; }
  .lab { color:#e5b93c; font-size:0.64rem; letter-spacing:0.22em; font-weight:700; margin-bottom:0.3rem; }
  .ht { font-size:1.2rem; font-weight:700; line-height:1.2; text-shadow:0 2px 8px #000; }
  .hs { color:#ddd; font-size:0.9rem; margin:0.15rem 0 0.5rem; }
  .prog { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.6rem; }
  .track { flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.25); overflow:hidden; }
  .fill { height:100%; background:#e5b93c; border-radius:2px; }
  .pct { font-size:0.75rem; color:#ccc; }
  .pbtn { display:inline-flex; align-items:center; gap:0.4rem; background:#e5b93c; color:#111; border:none; border-radius:30px; padding:0.55rem 1rem; font-weight:800; letter-spacing:0.08em; font-size:0.72rem; }
  .pbtn svg { width:18px; height:18px; }
  .dots { position:absolute; left:1.1rem; bottom:0.9rem; display:flex; gap:7px; z-index:3; }
  .dots i { width:7px; height:7px; border-radius:4px; background:rgba(255,255,255,0.35); transition:all 0.3s; }
  .dots i.on { width:20px; background:#e5b93c; }
  .sec { display:flex; align-items:center; gap:0.6rem; padding:1.2rem 1rem 0.3rem; }
  .sec svg { width:28px; height:28px; color:#e5b93c; }
  .sec h3 { font-size:1.15rem; font-weight:700; }
  .pill { border:1px solid rgba(229,185,60,0.6); color:#e5b93c; border-radius:20px; padding:0.15rem 0.7rem; font-size:0.78rem; }
  #countPill { border:none; border-radius:0; padding:0; margin-left:auto; color:#808080; font-size:0.78rem; font-weight:400; }
  .tools { display:flex; align-items:center; gap:0.8rem; padding:0.4rem 1rem 0.9rem; color:#aaa; font-size:0.86rem; }
  .tools .sep { width:1px; height:18px; background:#333; }
  .tools button { background:none; border:none; color:#aaa; display:flex; align-items:center; gap:0.35rem; font-size:0.86rem; }
  .tools button svg { width:20px; height:20px; }
  .card { display:flex; align-items:center; gap:0.65rem; margin:0 0.9rem 0.7rem; padding:0.65rem; background:#141414; border:1px solid #262626; border-radius:14px; }
  .poster { width:66px; height:96px; object-fit:cover; border-radius:8px; background:#222; flex:none; }
  .info { flex:1; min-width:0; }
  .ct { font-size:1.02rem; font-weight:700; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ct1 { font-size:1rem; font-weight:700; }
  .cm { color:#9a9a9a; font-size:0.82rem; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .when { color:#858585; font-size:0.72rem; margin-top:3px; line-height:1.25; }
  .ok { display:flex; align-items:center; gap:0.3rem; color:#3ddc84; font-size:0.78rem; margin-top:4px; white-space:nowrap; }
  .ok svg { width:16px; height:16px; flex:none; }
  .ok.run { color:#aaa; }
  .wp { height:3px; background:#2a2a2a; border-radius:2px; margin-top:6px; overflow:hidden; }
  .wp div { height:100%; background:#e5b93c; }
  .go { width:40px; height:40px; box-sizing:border-box; border-radius:50%; background:rgba(229,185,60,0.07); color:rgba(229,185,60,0.75); border:2px solid rgba(229,185,60,0.45); display:flex; align-items:center; justify-content:center; flex:none; }
  .go svg { width:18px; height:18px; fill:rgba(229,185,60,0.75); }
  .go.sm { width:36px; height:36px; }
  .more { background:none; border:none; color:#aaa; width:26px; height:40px; display:flex; align-items:center; justify-content:center; flex:none; }
  .more svg { width:22px; height:22px; }
  .more.del { color:#ff6b6b; }
  .chk { width:26px; height:26px; border-radius:50%; border:2px solid #666; flex:none; display:flex; align-items:center; justify-content:center; margin-right:0.3rem; }
  .chk.on { background:#e5b93c; border-color:#e5b93c; color:#111; }
  .chk svg { width:18px; height:18px; }
  .foot { display:flex; flex-direction:column; align-items:center; gap:0.5rem; color:#888; font-size:0.85rem; text-align:center; margin:1.6rem 1rem 0; }
  .foot svg { width:26px; height:26px; color:#777; }
  .empty { color:#888; text-align:center; margin:3rem 1rem; line-height:1.5; }
  #selBar { display:none; position:fixed; left:0; right:0; bottom:0; background:#1a1a1a; border-top:1px solid #333; padding:0.8rem 1rem; z-index:8; align-items:center; gap:0.6rem; }
  .sb { border:none; border-radius:8px; padding:0.55rem 0.9rem; font-weight:700; background:#2a2a2a; color:#fff; font-size:0.9rem; }
  .sb.red { background:#ff5a5a; color:#111; }
  #sheetWrap { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10; align-items:flex-end; }
  .sheet { width:100%; max-height:84vh; overflow-y:auto; background:#1a1a1a; border-radius:20px 20px 0 0; padding:0.4rem 0 1.2rem; }
  .sh { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem 0.8rem; border-bottom:1px solid #2c2c2c; margin-bottom:0.3rem; }
  .shl { display:flex; align-items:center; gap:0.4rem; min-width:0; }
  .sht { font-size:1.25rem; font-weight:700; }
  .shs { color:#999; font-size:0.85rem; margin-top:2px; }
  .xbtn { width:38px; height:38px; border-radius:50%; background:#2a2a2a; border:none; color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .xbtn svg { width:20px; height:20px; }
  .mrow { display:flex; align-items:center; gap:1rem; width:100%; background:none; border:none; color:#fff; text-align:left; padding:0.9rem 1.2rem; }
  .mrow > svg:first-child { width:24px; height:24px; color:#e5b93c; flex:none; }
  .mrow > span { flex:1; min-width:0; }
  .mrow b { display:block; font-size:1.02rem; font-weight:600; }
  .mrow small { display:block; color:#9a9a9a; font-size:0.84rem; margin-top:2px; }
  .mrow > svg:last-child { width:22px; height:22px; color:#777; flex:none; }
  .mrow.red b, .mrow.red > svg:first-child { color:#ff6b6b; }
  .msep { height:1px; background:#2c2c2c; margin:0.4rem 1.2rem; }
  .sbar { height:10px; border-radius:5px; background:#2a2a2a; margin:0.8rem 1.2rem; overflow:hidden; }
  .sbar div { height:100%; background:#e5b93c; }
  .srow { display:flex; justify-content:space-between; gap:1rem; padding:0.5rem 1.2rem; color:#ccc; font-size:0.92rem; }
  .srow span:last-child { color:#999; flex:none; }
  .sw { width:46px; height:26px; border-radius:13px; background:#444; border:none; position:relative; flex:none; }
  .sw i { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left 0.2s; }
  .sw.on { background:#e5b93c; }
  .sw.on i { left:23px; }
  .arow, .erow { padding:0.7rem 1.2rem; border-bottom:1px solid #262626; }
  .erow { display:flex; align-items:center; gap:0.7rem; }
  .arow1 { display:flex; align-items:center; justify-content:space-between; gap:0.8rem; }
  #askWrap { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:20; align-items:center; justify-content:center; padding:1.5rem; }
  .ask { background:#1a1a1a; border-radius:16px; padding:1.4rem; width:100%; max-width:340px; }
  .ask p { margin-bottom:1.2rem; line-height:1.4; }
  .ask .row { display:flex; gap:0.7rem; justify-content:flex-end; }
  .ask button { border:none; border-radius:8px; padding:0.65rem 1.2rem; font-weight:700; font-size:0.95rem; }
  .ask .no { background:#2a2a2a; color:#fff; }
  .ask .yes { background:#ff5a5a; color:#111; }

  .upsearch { margin:.4rem 1.2rem .6rem; }
  .upsearch input { width:100%; box-sizing:border-box; background:#111; border:1px solid #333; color:#fff; border-radius:14px; padding:.7rem 1rem; font-size:.95rem; outline:none; }
  .uph { color:#888; font-size:.8rem; letter-spacing:.08em; font-weight:700; padding:.9rem 1.2rem .3rem; }
  .upr2 { display:flex; align-items:center; gap:.8rem; padding:.7rem 1.2rem; border-bottom:1px solid #242424; }
  .upth { width:52px; height:52px; flex:none; border-radius:10px; background:#2a2418; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
  .upm { flex:1; min-width:0; }
  .upt { font-weight:600; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ups { color:#e5b93c; font-size:.82rem; margin:2px 0 4px; }
  .upz { color:#888; font-size:.78rem; margin-top:4px; }
  .upa { display:flex; align-items:center; gap:.3rem; flex:none; }
  .upd { background:none; border:none; color:#aaa; font-size:1.5rem; padding:.2rem .5rem; }

  .uph { font-size:.7rem; font-weight:700; color:rgba(255,255,255,.5); letter-spacing:.08em; text-transform:uppercase; padding:1.1rem 1.2rem .5rem; }
  .upsearch { position:relative; margin:.4rem 1.2rem .6rem; }
  .upsearch svg { position:absolute; left:.9rem; top:50%; transform:translateY(-50%); width:18px; height:18px; color:#888; }
  .upsearch input { padding-left:2.6rem; border-radius:14px; background:#141414; border:1px solid rgba(255,255,255,.12); }
  .upr2 { gap:.9rem; padding:1rem 1.2rem; border-bottom:1px solid rgba(255,255,255,.05); }
  .upth2 { position:relative; flex:none; width:54px; height:78px; border-radius:5px; background:#1e1e1e; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
  .upth2 .bar { position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.2); border-radius:0 0 5px 5px; overflow:hidden; }
  .upth2 .bar i { display:block; height:100%; background:linear-gradient(90deg,#e5b93c,#f5d97a); }
  .uptitle { font-size:.92rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .uppill { display:inline-flex; align-items:center; gap:.25rem; border:1px solid rgba(229,185,60,.45); color:rgba(229,185,60,.75); border-radius:999px; padding:.15rem .6rem; font-size:.68rem; font-weight:600; margin-top:4px; }
  .upl1 { font-size:.74rem; color:rgba(255,255,255,.7); margin-top:4px; }
  .upl2 { font-size:.68rem; color:rgba(255,255,255,.32); margin-top:2px; }
  .upbtn { flex:none; background:none; border:none; padding:.2rem; display:flex; align-items:center; justify-content:center; }

<body>
  <div id="offlineView">
    <img class="hero0" src="file:///android_asset/offline.png" alt="Offline"/>
    <h1>You're Offline</h1>
    <p class="sub">Check your internet connection and try again.</p>
    <button class="btn" id="dlBtn" style="display:none" onclick="showDownloads()">View My Downloads</button>
    <button class="btn ghost" onclick="location.href='https://keromisec9-prog.github.io/picha-plus/'">Try Again</button>
  </div>
  <div id="dlView">
    <div class="bar">
      <button class="ibtn" onclick="hideDownloads()" id="icBack"></button>
      <h2>My Downloads</h2>
      <div class="store"><span id="icStore"></span><div class="t"><span id="usedTxt"></span><small id="freeTxt"></small></div></div>
    </div>
    <div id="heroBox"></div>
    <div class="sec"><span id="icSec"></span><h3>Downloaded for offline</h3><span class="pill" id="countPill"></span></div>
    <div class="tools">
      <span id="usedTxt2"></span><span class="sep"></span>
      <button onclick="manageMenu()"><span id="icTune"></span>Manage</button><span class="sep"></span>
      <button onclick="cycleSort()"><span id="icSort"></span><span id="sortTxt">Sort</span></button>
    </div>
    <div id="list"></div>
    <div class="foot" id="foot" style="display:none"><span id="icFoot"></span><div>Your downloaded content is available offline.<br>Enjoy anytime, anywhere.</div></div>
  </div>
  <div id="selBar"><span id="selTxt" style="flex:1"></span><button class="sb" onclick="selAll()">All</button><button class="sb red" onclick="selDelete()">Delete</button><button class="sb" onclick="selCancel()">Cancel</button></div>
  <div id="sheetWrap" onclick="closeSheet()"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div>
  <div id="askWrap"><div class="ask"><p id="askMsg"></p><div class="row"><button class="no" onclick="askClose()">Cancel</button><button class="yes" id="askYes">Delete</button></div></div></div>
<script>
var IC = {
  back:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
  down:'M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z',
  kebab:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
  play:'M8 5v14l11-7z',
  check:'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z',
  tick:'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
  tune:'M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z',
  sort:'M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z',
  del:'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  close:'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  chev:'M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z',
  list:'M22 7h-9v2h9V7zm0 8h-9v2h9v-2zM5.54 11L2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19z',
  store:'M20 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H4V8h16v8zM6 14h2v-2H6v2z',
  clean:'M15 16h4v2h-4v-2zm0-8h7v2h-7V8zm0 4h6v2h-6v-2zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12V5z',
  eps:'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z'
};
function svg(k){ return '<svg viewBox="0 0 24 24"><path d="'+IC[k]+'"/></svg>'; }
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function tp(n,w){ return n+' '+w+(n===1?'':'s'); }
function fmt(b){ b=Math.max(0,b||0); if(b>=950000000) return (b/1073741824).toFixed(1)+' GB'; return Math.max(b>0?1:0,Math.round(b/1048576))+' MB'; }
function fmtT(ms){ var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60; return h>0?h+':'+('0'+m).slice(-2)+':'+('0'+c).slice(-2):m+':'+('0'+c).slice(-2); }
function fmtDate(ts){
  if(!ts) return '';
  var d=new Date(ts), n=new Date();
  var t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  var a=new Date(n.getFullYear(),n.getMonth(),n.getDate()), b=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var diff=Math.round((a-b)/86400000);
  if(diff===0) return 'Today '+t;
  if(diff===1) return 'Yesterday '+t;
  if(diff>1&&diff<7) return d.toLocaleDateString([],{weekday:'long'})+' '+t;
  return d.toLocaleDateString([],{month:'long',day:'numeric'})+' '+t;
}
function parse(t){ var m=/^(.*?)\s+E(\d+)$/.exec(t||''); return m?{base:m[1],ep:m[2]}:{base:t||'Video',ep:null}; }
function getDls(){ try { return JSON.parse(window.PichaApp.getDownloads()); } catch(e){ return []; } }
function getFree(){ try { return parseFloat(window.PichaApp.getFreeBytes())||0; } catch(e){ return 0; } }
function rm(id){ try { window.PichaApp.removeDownload(id); } catch(e){} }

var sortMode=0, sortNames=['Recent','Name','Size'], DATA=[], selecting=false, sel={}, heroTimer=0, actTimer=0, curPanel='';

function initIcons(){
  $('icBack').innerHTML=svg('back'); $('icStore').innerHTML=svg('down');
  $('icSec').innerHTML=svg('down'); $('icTune').innerHTML=svg('tune'); $('icSort').innerHTML=svg('sort'); $('icFoot').innerHTML=svg('down');
}
function initBtn(){
  if(!window.PichaApp || !window.PichaApp.getDownloads) return;
  var n=getDls().filter(function(x){return x.status==='done';}).length;
  var b=$('dlBtn'); b.style.display='inline-block';
  b.textContent='View My Downloads'+(n?' ('+n+')':'');
}
function showDownloads(){ $('offlineView').style.display='none'; $('dlView').style.display='block'; render(); }
function hideDownloads(){
  if (FROMSITE) { history.back(); return; }
  clearInterval(heroTimer); closeSheet(); selecting=false; sel={};
  $('selBar').style.display='none'; $('dlView').style.display='none'; $('offlineView').style.display='flex'; initBtn();
}
function sz(x){ return Math.max(0,(x.status==='done'?x.bytes:x.got)||0); }
function totalUsed(){ var u=0; DATA.forEach(function(x){u+=sz(x);}); return u; }
function titleCount(){ var t={}; DATA.forEach(function(x){t[parse(x.title).base]=1;}); return Object.keys(t).length; }
function inProg(x){ return x.pos>0 && x.dur>0 && x.pos/x.dur<0.95; }
function sorted(d){
  var a=d.slice();
  if(sortMode===0) a.sort(function(x,y){return (y.ts||0)-(x.ts||0);});
  else if(sortMode===1) a.sort(function(x,y){return (x.title||'').localeCompare(y.title||'');});
  else a.sort(function(x,y){return sz(y)-sz(x);});
  return a;
}
function cycleSort(){ sortMode=(sortMode+1)%3; render(); }

function buildHero(done){
  clearInterval(heroTimer);
  var hb=$('heroBox'); hb.innerHTML='';
  if(selecting||!done.length) return;
  var prog=done.filter(inProg).sort(function(a,b){return (b.seen||0)-(a.seen||0);});
  var rest=done.filter(function(x){return !inProg(x);}).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  var items=prog.concat(rest).slice(0,5), html='';
  items.forEach(function(h,i){
    var p=parse(h.title), cont=inProg(h), pct=cont?Math.round(h.pos/h.dur*100):0;
    html+='<div class="slide'+(i?'':' on')+'">'+(h.poster?'<img class="bg" src="'+h.poster+'">':'<div class="bgfall"></div>')+'<div class="shade"></div>'+(h.poster?'<img class="pic" src="'+h.poster+'">':'')+
      '<div class="in"><div class="lab">'+(cont?'CONTINUE WATCHING':'READY TO WATCH')+'</div><div class="ht">'+esc(p.base)+'</div><div class="hs">'+(p.ep?'Episode '+p.ep:'Movie')+'</div>'+
      (cont?'<div class="prog"><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span class="pct">'+pct+'%</span></div>':'')+
      '<button class="pbtn" data-i="'+i+'">'+svg('play')+(p.ep?'PLAY EPISODE':'PLAY MOVIE')+'</button></div></div>';
  });
  if(items.length>1) html+='<div class="dots">'+items.map(function(_,i){return '<i class="'+(i?'':'on')+'" data-d="'+i+'"></i>';}).join('')+'</div>';
  var el=document.createElement('div'); el.className='hero'; el.innerHTML=html; hb.appendChild(el);
  var slides=el.querySelectorAll('.slide'), dots=el.querySelectorAll('.dots i'), cur=0;
  function go(n){ slides[cur].classList.remove('on'); if(dots[cur]) dots[cur].classList.remove('on'); cur=n; slides[cur].classList.add('on'); if(dots[cur]) dots[cur].classList.add('on'); }
  Array.prototype.forEach.call(el.querySelectorAll('.pbtn'),function(b){ b.onclick=function(){ playIt(items[parseInt(b.getAttribute('data-i'),10)].id); }; });
  Array.prototype.forEach.call(dots,function(d){ d.onclick=function(){ go(parseInt(d.getAttribute('data-d'),10)); }; });
  if(items.length>1) heroTimer=setInterval(function(){ go((cur+1)%items.length); },5000);
}

function whenTxt(x){
  if(x.pos>0&&x.dur>0) return 'Watched '+fmtT(x.pos)+' / '+fmtT(x.dur)+(x.seen?' \u00b7 '+fmtDate(x.seen):'');
  if(x.watched) return 'Watched '+fmtDate(x.seen||x.ts);
  return 'Downloaded '+fmtDate(x.ts);
}
function render(){
  DATA=getDls();
  var done=DATA.filter(function(x){return x.status==='done';});
  var used=totalUsed();
  $('usedTxt').textContent=fmt(used)+' used'; $('usedTxt2').textContent=fmt(used)+' used';
  var free=getFree(); $('freeTxt').textContent=free?'('+fmt(free)+' available)':'';
  $('countPill').textContent=tp(titleCount(),'title');
  $('sortTxt').textContent='Sort: '+sortNames[sortMode];
  $('selBar').style.display=selecting?'flex':'none';
  $('selTxt').textContent=Object.keys(sel).length+' selected';
  buildHero(done);
  var list=$('list'); list.innerHTML='';
  if(!DATA.length){ list.innerHTML='<div class="empty">No downloads yet.</div>'; $('foot').style.display='none'; return; }
  $('foot').style.display='flex';
  sorted(DATA).forEach(function(x){
    var p=parse(x.title), isDone=x.status==='done';
    var pct=(x.pos>0&&x.dur>0)?Math.min(100,Math.round(x.pos/x.dur*100)):0;
    var dl=x.bytes>0?Math.min(100,Math.round((x.got||0)/x.bytes*100)):0;
    var card=document.createElement('div'); card.className='card';
    card.innerHTML=(x.poster?'<img class="poster" src="'+x.poster+'">':'<div class="poster"></div>')+
      '<div class="info"><div class="ct">'+esc(p.base)+'</div>'+
      '<div class="cm">'+(p.ep?'Episode '+p.ep+' \u00b7 ':'')+fmt(sz(x))+'</div>'+
      (isDone?'':'<div class="ok run">Downloading\u2026 '+dl+'%</div>')+
      (isDone?'<div class="when">'+esc(whenTxt(x))+'</div>':'')+
      (isDone&&pct>0?'<div class="wp"><div style="width:'+pct+'%"></div></div>':'')+'</div>'+
      (selecting?'<div class="chk'+(sel[x.id]?' on':'')+'">'+(sel[x.id]?svg('tick'):'')+'</div>':(isDone?'<button class="go">'+svg('play')+'</button>':'')+'<button class="more">'+svg('kebab')+'</button>');
    if(selecting){ card.onclick=function(){ selToggle(x.id); }; }
    else { if(isDone) card.querySelector('.go').onclick=function(){ playIt(x.id); }; card.querySelector('.more').onclick=function(){ cardMenu(x); }; }
    list.appendChild(card);
  });
}
function playIt(id){ try { if(!window.PichaApp.playDownload(id)){ render(); } } catch(e){} }

function selToggle(id){ if(sel[id]) delete sel[id]; else sel[id]=1; render(); }
function startSelect(){ closeSheet(); selecting=true; sel={}; render(); }
function selAll(){ DATA.forEach(function(x){ sel[x.id]=1; }); render(); }
function selCancel(){ selecting=false; sel={}; render(); }
function selDelete(){
  var ids=Object.keys(sel); if(!ids.length) return;
  var s=0; DATA.forEach(function(x){ if(sel[x.id]) s+=sz(x); });
  ask('Delete '+tp(ids.length,'download')+' ('+fmt(s)+')?',function(){ ids.forEach(function(i){ rm(parseFloat(i)); }); selecting=false; sel={}; render(); initBtn(); });
}
function deleteAll(){
  closeSheet(); DATA=getDls(); if(!DATA.length) return;
  ask('Delete all '+tp(DATA.length,'download')+' ('+fmt(totalUsed())+') from this device?',function(){ DATA.forEach(function(x){ rm(x.id); }); render(); initBtn(); });
}

<script id="pp-liveprog">
(function(){
  if(typeof render!=='function'||typeof sorted!=='function') return;
  var _render=render, tmr=0, last={}, spd={};
  function pctOf(x){ return x.bytes>0?Math.min(100,Math.round((x.got||0)/x.bytes*100)):0; }
  render=function(){
    _render();
    var s=sorted(DATA), cs=document.querySelectorAll('#list .card');
    for(var i=0;i<s.length&&i<cs.length;i++){
      cs[i].setAttribute('data-id',s[i].id);
      if(s[i].status==='running'){
        var inf=cs[i].querySelector('.info');
        if(inf&&!inf.querySelector('.dlw')){
          var w=document.createElement('div'); w.className='wp dlw';
          w.innerHTML='<div style="width:'+pctOf(s[i])+'%"></div>';
          inf.appendChild(w);
        }
      }
    }
    clearInterval(tmr); tmr=0;
    if(DATA.some(function(x){return x.status==='running';})) tmr=setInterval(tick,1000);
  };
  function tick(){
    if($('dlView').style.display==='none'){ clearInterval(tmr); tmr=0; return; }
    var arr; try { arr=JSON.parse(window.PichaApp.getProgress()); } catch(e){ return; }
    var now=Date.now(), redo=false, by={};
    arr.forEach(function(p){ by[p.id]=p; });
    DATA.forEach(function(x){
      if(x.status!=='running') return;
      var p=by[x.id];
      if(!p||p.status!=='running'){ redo=true; return; }
      var l=last[x.id], inst=0;
      if(l&&now>l.t) inst=(p.got-l.got)/((now-l.t)/1000);
      last[x.id]={t:now,got:p.got};
      spd[x.id]=spd[x.id]?spd[x.id]*0.6+inst*0.4:inst;
      x.got=p.got; x.bytes=p.bytes;
      var c=document.querySelector('#list .card[data-id="'+x.id+'"]'); if(!c) return;
      var pc=pctOf(x), sp=spd[x.id], pr=parse(x.title);
      var txt='Downloading\u2026 '+pc+'%';
      if(sp>1024){ txt+=' \u00b7 '+(sp/1048576).toFixed(1)+' MB/s'; if(x.bytes>x.got) txt+=' \u00b7 '+fmtT((x.bytes-x.got)/sp*1000)+' left'; }
      var ok=c.querySelector('.ok'); if(ok) ok.textContent=txt;
      var cm=c.querySelector('.cm'); if(cm) cm.textContent=(pr.ep?'Episode '+pr.ep+' \u00b7 ':'')+fmt(sz(x));
      var bar=c.querySelector('.dlw div'); if(bar) bar.style.width=pc+'%';
    });
    $('usedTxt').textContent=fmt(totalUsed())+' used'; $('usedTxt2').textContent=fmt(totalUsed())+' used';
    if(redo) render();
  }
})();
</script>

<script id="pp-backstack">
(function(){
try{
  var ST=[],Q=[],busy=false,tmo=null,curP=null,lastBack=null,restoring=false;
  function $(id){return document.getElementById(id);}
  function sheetOpen(){var w=$("sheetWrap");return !!w&&w.style.display==="flex";}
  function askOpen(){var w=$("askWrap");return !!w&&w.style.display==="flex";}
  function dlOpen(){var w=$("dlView");return !!w&&w.style.display==="block";}
  function selOn(){return typeof selecting!=="undefined"?!!selecting:true;}
  function selNow(){return typeof selecting!=="undefined"&&!!selecting;}
  function fromSite(){return typeof FROMSITE!=="undefined"&&!!FROMSITE;}
  function run(){
    if(busy)return;
    var op=Q.shift();
    if(!op)return;
    if(op.push){
      try{history.pushState({ppo:1},"",location.href);}catch(e){}
      run();return;
    }
    busy=true;
    tmo=setTimeout(function(){busy=false;run();},800);
    try{history.go(op.go);}catch(e){busy=false;clearTimeout(tmo);run();}
  }
  function qgo(n){if(n>0){Q.push({go:-n});run();}}
  function push(o){ST.push(o);Q.push({push:1});run();}
  function alive(o){
    if(o.kind==="sheet"||o.kind==="panel")return sheetOpen();
    if(o.kind==="ask")return askOpen();
    if(o.kind==="select")return selOn();
    if(o.kind==="dl")return dlOpen();
    return true;
  }
  function sweep(){
    var n=0;
    while(ST.length&&!alive(ST[ST.length-1])){ST.pop();n++;}
    qgo(n);
  }
  window.addEventListener("popstate",function(){
    if(busy){busy=false;clearTimeout(tmo);run();return;}
    var o=ST.pop();
    if(!o)return;
    try{o.close();}catch(e){}
    sweep();
  });
  function wrap(name,fn){var o=window[name];if(typeof o==="function")window[name]=fn(o);}
  var rawClose=window.closeSheet,rawCancel=window.selCancel,rawHide=window.hideDownloads;

  wrap("openSheet",function(o){return function(){
    var was=sheetOpen();
    var r=o.apply(this,arguments);
    if(!was)push({kind:"sheet",close:function(){rawClose();curP=null;}});
    return r;};});
  wrap("closeSheet",function(o){return function(){
    var r=o.apply(this,arguments);curP=null;sweep();return r;};});

  ["manageMenu","storagePanel","activityPanel","cleanupPanel","episodes","cardMenu","uploadsPanel","upCancelAsk","cleanAppAsk"].forEach(function(nm){
    wrap(nm,function(o){return function(){
      var me={nm:nm,args:[].slice.call(arguments)};
      if(!restoring&&sheetOpen()&&curP&&curP.nm!==nm){
        var prev=curP;
        push({kind:"panel",close:function(){
          restoring=true;
          try{window[prev.nm].apply(window,prev.args);}finally{restoring=false;}
        }});
      }
      curP=me;
      return o.apply(this,arguments);
    };});
  });

  wrap("sheetHead",function(o){return function(t,s,back){
    if(back){lastBack=back;return o.call(this,t,s,"ppBack()");}
    return o.apply(this,arguments);};});
  window.ppBack=function(){
    var top=ST[ST.length-1];
    if(top&&top.kind==="panel"){ST.pop();qgo(1);try{top.close();}catch(e){}}
    else if(lastBack){try{(new Function(lastBack))();}catch(e){}}
  };

  wrap("ask",function(o){return function(){
    var was=askOpen();
    var r=o.apply(this,arguments);
    if(!was)push({kind:"ask",close:function(){var w=$("askWrap");if(w)w.style.display="none";}});
    return r;};});
  wrap("askClose",function(o){return function(){
    var r=o.apply(this,arguments);sweep();return r;};});

  wrap("startSelect",function(o){return function(){
    var r=o.apply(this,arguments);
    if(selNow()&&!ST.some(function(e){return e.kind==="select";}))
      push({kind:"select",close:function(){rawCancel();}});
    return r;};});
  wrap("selCancel",function(o){return function(){
    var r=o.apply(this,arguments);sweep();return r;};});
  wrap("render",function(o){return function(){
    var r=o.apply(this,arguments);sweep();return r;};});

  wrap("showDownloads",function(o){return function(){
    var was=dlOpen();
    var r=o.apply(this,arguments);
    if(!was&&!fromSite()&&dlOpen())push({kind:"dl",close:function(){rawHide();}});
    return r;};});
  window.__ppOfflineBack=function(){
    if(!ST.length) return false;
    var top=ST.pop(); qgo(1);
    try{top.close();}catch(e){}
    return true;
  };

  wrap("hideDownloads",function(o){return function(){
    var r=o.apply(this,arguments);sweep();return r;};});
}catch(e){}
})();
</script>

<script>
(function(){
  function go(){
    if (location.hash !== '#uploads') return;
    try { FROMSITE = true; } catch(e){}
    window.UP_DIRECT = false;
    if (typeof curPanel !== 'undefined' && curPanel === 'ups') return;
    var de = document.documentElement;
    de.classList.add('ppdeep');
    var shown = false;
    function reveal(){
      if (shown) return; shown = true;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ de.classList.remove('ppdeep'); }); });
    }
    setTimeout(reveal, 2500);
    setTimeout(function(){
      try { if ($('dlView').style.display !== 'block') showDownloads(); } catch(e){}
      try { manageMenu(); } catch(e){}
      setTimeout(function(){
        try { uploadsPanel(); } catch(e){}
        reveal();
      }, 120);
    }, 350);
  }
  go();
  window.addEventListener('hashchange', go);
})();
</script>

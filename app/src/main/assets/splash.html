<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Picha+ Splash</title>
<style>
  :root{
    --crimson:#D90429;
    --deep-crimson:#8B0018;
    --amber:#FFB000;
    --cinema-black:#000000;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--cinema-black);
    overflow:hidden;
    font-family:Arial, sans-serif;
  }
  .stage{
    width:100%; height:100vh;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background: var(--cinema-black);
  }
  .lockup{ display:flex; align-items:center; gap:0px; }

  .logo-img{
    width:130px; height:130px;
    object-fit:contain;
    display:block;
    opacity:0;
    transform:skewY(-4deg) scale(0.97) translateY(4px);
    animation: fillIn 0.5s ease-out 0.9s forwards,
               settle 0.7s cubic-bezier(0.16,1,0.3,1) 1.55s forwards,
               glowPulse 2.6s ease-in-out 2.3s infinite;
  }

  .ground-glow{
    position:absolute; bottom:14px; left:50%;
    transform:translateX(-50%);
    width:150px; height:16px;
    background:radial-gradient(ellipse, rgba(255,176,0,0.55) 0%, rgba(217,4,41,0.25) 40%, transparent 75%);
    filter:blur(6px);
    opacity:0;
    animation:groundFade 0.8s ease-out 1.6s forwards;
  }

  .wordmark-img{
    height:74px; width:auto;
    margin-left:-19px;
    display:block;
    opacity:0; transform:translateX(-16px);
    animation:wordIn 0.6s cubic-bezier(0.16,1,0.3,1) 1.95s forwards;
  }

  @keyframes fillIn{ to{ opacity:1; } }
  @keyframes settle{
    0%{ transform:skewY(-4deg) scale(0.97) translateY(4px); }
    100%{ transform:skewY(0deg) scale(1) translateY(0); filter:drop-shadow(0 0 22px rgba(255,176,0,0.4)); }
  }
  @keyframes glowPulse{
    0%,100%{ filter:drop-shadow(0 0 18px rgba(255,176,0,0.28)); }
    50%{ filter:drop-shadow(0 0 32px rgba(255,176,0,0.55)); }
  }
  @keyframes groundFade{ to{ opacity:1; } }
  @keyframes wordIn{ to{ opacity:1; transform:translateX(0); } }
</style>
</head>

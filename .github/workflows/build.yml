name: Build APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        run: |
          mkdir -p gradle/wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          export PATH=$PATH:/tmp/gradle/gradle-8.0/bin
          echo "/tmp/gradle/gradle-8.0/bin" >> $GITHUB_PATH
      - name: Build APK
        run: gradle assembleRelease
      - name: Build AAB
        run: gradle bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pichaplus-release
          path: app/build/outputs/apk/release/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pichaplus-bundle
          path: app/build/outputs/bundle/release/*.aab
